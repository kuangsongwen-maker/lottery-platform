services:
  - type: web
    name: lottery-platform
    env: docker
    # 注意：plan: free 每 15 分钟无流量即休眠，唤醒约 1 分钟；
    # 休眠时本地文件与后台定时任务一并清空，main.py 的 6 小时爬虫跑不起来。
    # 需要数据自动更新的话改成 plan: starter（不休眠，约 $7/月）。
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # DATABASE_URL 留空时在 Render 控制台手动填写，避免密钥进仓库。
      # 填了 PostgreSQL 连接串 -> 用 PG（数据持久，推荐）
      # 不填                  -> 用镜像内置的 lottery.db（数据随镜像，容器重启不丢但新写入会丢）
      - key: DATABASE_URL
        sync: false
